# THE CI CONTRACT — `task ci` is what CI runs and what you run locally. Rationale: github-actions-align/templates/README.md#taskfiles
version: '3'

includes:
  repo:
    taskfile: .taskfiles/repo.yml
  go:
    taskfile: .taskfiles/go.yml

vars:
  IMG: '{{.IMG | default "kiwix-operator:latest"}}'
  LOCALBIN: '{{.ROOT_DIR}}/bin'
  CONTROLLER_TOOLS_VERSION: v0.23.0
  CONTROLLER_GEN: '{{.LOCALBIN}}/controller-gen'
  ENVTEST_K8S_VERSION: 1.35.x
  SETUP_ENVTEST: '{{.LOCALBIN}}/setup-envtest'
  # Packages held to the coverage floor.
  COVERAGE_PACKAGES: ./internal/...
  COVERAGE_THRESHOLD: 70
  # Version stamping — injected into the binary via -ldflags so `kiwix-operator
  # --version` reports real values. ci-build mirrors these via the Dockerfile
  # build-args (VERSION/COMMIT/DATE).
  version:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  commit:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  date:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  ldflags: '-s -w -X main.version={{.version}} -X main.commit={{.commit}} -X main.date={{.date}}'

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list

  ## The contract

  ci:
    desc: Everything CI runs. Run this before pushing.
    cmds:
      - task: repo:ci
      - task: go:ci
      - task: coverage
      - task: verify-generated

  lint:
    desc: Static checks only
    cmds:
      - task: repo:ci
      - task: go:lint

  test:
    desc: Tests only
    cmds:
      - task: go:test

  test:kiwix:
    desc: Run the kiwix-tagged tests in an image that has kiwix-manage (needs docker; slow)
    cmds:
      - docker build -f test/kiwix.Dockerfile -t kiwix-operator-test:local .
      - docker run --rm -v "$PWD:/src" -v kiwix-operator-gomod:/go/pkg/mod -w /src -e GOFLAGS=-buildvcs=false kiwix-operator-test:local go test -tags kiwix ./internal/librarian/... -race -v

  # Every kubectl and helm call passes --kubeconfig and the kind context explicitly, as do kind create/delete; kind load talks only to docker. The tests read only the e2e kubeconfig and refuse any other context.
  e2e:
    desc: Run the end-to-end tests in a throwaway kind cluster (needs docker, kind and helm; slow)
    env:
      KUBECONFIG: /tmp/kiwix-e2e.kubeconfig
    vars:
      KIND_NODE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    cmds:
      - helm dependency build chart --kubeconfig /tmp/kiwix-e2e.kubeconfig
      - kind delete cluster --name kiwix-e2e --kubeconfig /tmp/kiwix-e2e.kubeconfig || true
      - kind create cluster --name kiwix-e2e --image {{.KIND_NODE}} --kubeconfig /tmp/kiwix-e2e.kubeconfig
      - defer: kind delete cluster --name kiwix-e2e --kubeconfig /tmp/kiwix-e2e.kubeconfig
      - docker build -t kiwix-operator:e2e .
      - docker build -f test/e2e/tools.Dockerfile -t kiwix-e2e-tools:e2e .
      # Only the local builds: docker's containerd store keeps one platform of a pulled index, and kind's --all-platforms import fails on it, so the node pulls the digest-pinned nginx and zimit itself.
      - kind load docker-image --name kiwix-e2e kiwix-operator:e2e kiwix-e2e-tools:e2e
      - kubectl --kubeconfig /tmp/kiwix-e2e.kubeconfig --context kind-kiwix-e2e apply -f test/e2e/manifests/tools.yaml
      - helm upgrade --install --kubeconfig /tmp/kiwix-e2e.kubeconfig --kube-context kind-kiwix-e2e kiwix-operator chart -n kiwix-system --create-namespace -f test/e2e/values.yaml --set "probeAllowCIDRs={$(docker network inspect kind -f '{{"{{"}}(index .IPAM.Config 0).Subnet{{"}}"}}')}"
      - go test -tags e2e -count=1 ./test/e2e/... -v -timeout 45m

  build:
    desc: Build the operator binary into ./bin/kiwix-operator
    cmds:
      - go build -ldflags '{{.ldflags}}' -o bin/kiwix-operator ./cmd

  # Runs locally: IMAGE=ghcr.io/jacaudi/kiwix-operator:sha-abc1234 task smoke
  smoke:
    desc: Assert the image starts and reports its version
    requires:
      vars: [IMAGE]
    # Accepts BOTH `IMAGE=… task smoke` and `task smoke IMAGE=…`.
    env:
      IMAGE: '{{.IMAGE}}'
    cmds:
      - |
        set -eu
        echo "smoke testing ${IMAGE}"
        out=$(docker run --rm "${IMAGE}" --version)
        echo "${out}"
        case "${out}" in kiwix-operator\ *) ;; *) echo "::error::unexpected --version output"; exit 1 ;; esac

  coverage:
    desc: Fail if coverage of the core packages drops below the floor
    cmds:
      - go test {{.COVERAGE_PACKAGES}} -coverprofile=coverage.out
      - |
        set -eu
        total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%/, "", $3); print $3 }')
        echo "total coverage: ${total}% (floor {{.COVERAGE_THRESHOLD}}%)"
        awk -v t="${total}" -v f="{{.COVERAGE_THRESHOLD}}" 'BEGIN { exit !(t >= f) }' \
          || { echo "::error::coverage ${total}% is below {{.COVERAGE_THRESHOLD}}%"; exit 1; }

  verify-generated:
    desc: Fail if generated artifacts (deepcopy, CRDs, RBAC, chart copies) are stale
    cmds:
      - task: generate
      - task: manifests
      - task: generate-helm-rbac
      - |
        paths="api/v1alpha1/zz_generated.deepcopy.go config/ chart/crds/ chart/templates/_values-rbac.tpl"
        # shellcheck disable=SC2086  # deliberate word split over the path list
        if ! git diff --quiet -- ${paths}; then
          echo "::error::generated artifacts are stale. Run: task generate manifests generate-helm-rbac" >&2
          git --no-pager diff --stat -- ${paths} >&2
          exit 1
        fi
        echo "generated artifacts are up to date"

  ## Code generation

  generate:
    desc: Generate DeepCopy, DeepCopyInto, and DeepCopyObject implementations
    deps: [controller-gen]
    cmds:
      - '{{.CONTROLLER_GEN}} object:headerFile="hack/boilerplate.go.txt" paths="./..."'

  manifests:
    desc: Generate ClusterRole and CRD manifests, and copy the CRDs into the chart
    deps: [controller-gen]
    cmds:
      - '{{.CONTROLLER_GEN}} rbac:roleName=manager-role crd:omitToolVersion=true webhook paths="./..." output:crd:artifacts:config=config/crd/bases'
      - cp config/crd/bases/*.yaml chart/crds/

  generate-helm-rbac:
    desc: Generate Helm RBAC template from kubebuilder role.yaml
    deps: [manifests]
    cmds:
      - ./hack/generate-helm-rbac.sh

  sync-helm-crds:
    desc: Sync CRDs to Helm chart (manifests already does this; kept for Renovate's postUpgradeTasks)
    deps: [manifests]

  ## Local development

  run:
    desc: Run the controller locally
    deps: [generate, manifests]
    cmds:
      - go run ./cmd manager

  container-build:
    desc: Build container image
    cmds:
      - docker build -t {{.IMG}} .

  container-push:
    desc: Push container image
    cmds:
      - docker push {{.IMG}}

  ## Tools

  controller-gen:
    desc: Install controller-gen if not present
    cmds:
      - mkdir -p {{.LOCALBIN}}
      - GOBIN={{.LOCALBIN}} go install sigs.k8s.io/controller-tools/cmd/controller-gen@{{.CONTROLLER_TOOLS_VERSION}}
    status:
      - test -s {{.CONTROLLER_GEN}}

  setup-envtest:
    desc: Install setup-envtest if not present
    cmds:
      - mkdir -p {{.LOCALBIN}}
      - GOBIN={{.LOCALBIN}} go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.25
    status:
      - test -s {{.SETUP_ENVTEST}}
