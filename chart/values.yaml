# kiwix-operator Helm chart, built on the bjw-s common library.
#
# global: passed through to bjw-s common.
# image: the operator image; tag "" means "v" + the chart appVersion (chart 0.1.0 runs image v0.1.0). The manager runs it and passes the same
#   repository:tag as --operator-image, so the librarian and crawl upload containers never drift from it.
# zimit.image: the crawl image, pinned by digest.
# catalogURL: the Kiwix OPDS catalog root that catalog downloads resolve against.
# webhookRetries: times a failed webhook notification is retried.
# crawlEgressAllowCIDRs: CIDRs added to the kiwix and crawl pods' internet egress rules.
# probeAllowCIDRs: CIDRs allowed to reach both kiwix pod ports, for policy implementations that filter kubelet probes.
# controller: replicas and update strategy; leader election is always on, so extra replicas stand by.
# resources: the manager container's requests and limits.
# serviceAccount: create it, or name an existing one, and its annotations.
# rbac.enabled: render the ClusterRole and ClusterRoleBinding generated from the kubebuilder markers.
---
global: {}

image:
  repository: ghcr.io/jacaudi/kiwix-operator
  tag: ""
  pullPolicy: IfNotPresent

zimit:
  image: ghcr.io/openzim/zimit:3.2.0@sha256:7d2d7f6a20d9d1a35e805e4b5abc494a622ab8572b39546503ad111d2005a6af

catalogURL: https://opds.library.kiwix.org

webhookRetries: 3

crawlEgressAllowCIDRs: []

probeAllowCIDRs: []

controller:
  replicas: 1
  strategy: Recreate

resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    memory: 256Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  enabled: true
